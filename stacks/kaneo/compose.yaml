services:
  db:
    image: postgres:16-alpine
    container_name: kaneo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaneo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?provided by Terraform (terraform/kaneo.tf)}
      POSTGRES_DB: kaneo
    volumes:
      - kaneo-pgdata:/var/lib/postgresql/data
    networks:
      - kaneo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  kaneo:
    image: ghcr.io/usekaneo/kaneo:2.19.0
    container_name: kaneo
    restart: unless-stopped
    expose:
      - "5173"
    depends_on:
      db:
        condition: service_healthy
    environment:
      KANEO_CLIENT_URL: https://kaneo.home.m1xxos.online
      KANEO_API_URL: https://kaneo.home.m1xxos.online
      DATABASE_URL: postgresql://kaneo:${POSTGRES_PASSWORD:?provided by Terraform (terraform/kaneo.tf)}@db:5432/kaneo
      AUTH_SECRET: ${AUTH_SECRET_KANEO:?provided by Terraform (terraform/kaneo.tf)}
      GITHUB_APP_ID: ${GITHUB_APP_ID_KANEO:-}
      GITHUB_APP_NAME: ${GITHUB_APP_NAME_KANEO:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET_KANEO:-}
      GITHUB_PRIVATE_KEY_BASE64: ${GITHUB_PRIVATE_KEY_BASE64_KANEO:-}
    networks:
      - kaneo
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kaneo.entrypoints=websecure"
      - "traefik.http.routers.kaneo.rule=Host(`kaneo.home.m1xxos.online`)"
      - "traefik.http.services.kaneo.loadbalancer.server.port=5173"
      - "traefik.http.routers.kaneo.tls=true"
      # public entrypoint for GitHub App webhooks only (Cloudflare tunnel, pi-server/terraform/shisha-tunnel.tf)
      - "traefik.http.routers.kaneo-gh.entrypoints=websecure"
      - "traefik.http.routers.kaneo-gh.rule=Host(`kaneo.m1xxos.online`) && Path(`/api/github-integration/webhook`)"
      - "traefik.http.routers.kaneo-gh.service=kaneo"
      - "traefik.http.routers.kaneo-gh.tls.certresolver=based"
      - "traefik.docker.network=traefik_proxy"

volumes:
  kaneo-pgdata:

networks:
  proxy:
    external:
      name: traefik_proxy
  kaneo:
